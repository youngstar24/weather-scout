<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>追景地图 WeatherScout · 全国天气预测地图 Demo</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/style.css?v=7">

</head>
<body>

<header id="topbar">
  <div class="brand">🏔️ 追景地图 <span class="sub">WeatherScout · 网页 Demo</span></div>
  <div id="dateAxis" class="date-axis" title="D0–D15 日期时间轴，色点为预报可信度"></div>
  <div class="actions">
    <label class="origin-label">出发地 <select id="originSel"></select></label>
    <button id="btnSubs" class="btn">🔔 订阅<span id="subCount" class="badge"></span></button>
    <button id="btnAbout" class="btn">📖 数据说明</button>
    <button id="btnRefresh" class="btn" title="实时重新抓取 Open-Meteo 数据">↻ 刷新</button>
  </div>
</header>

<div id="filterBar">
  <div class="chips" id="landChips"></div>
  <div class="filter-more">
    <label class="thr-label">概率阈值 <input type="range" id="threshold" min="10" max="95" value="50"> <b id="thresholdVal">50%</b></label>
    <div class="chips sm" id="qualChips"></div>
    <details id="ringBox">
      <summary>等时圈（近似）</summary>
      <div id="ringChecks"></div>
    </details>
    <select id="sortBy">
      <option value="prob">排序：概率</option>
      <option value="dist">排序：距离</option>
      <option value="quality">排序：质量</option>
    </select>
  </div>
</div>

<div id="dateCapRow" class="m-only">
  <button id="dateCap" type="button">📅 <b id="dateCapText"></b><span class="cap-caret">点击选择 ▾</span></button>
</div>
<div id="quickChipsRow" class="m-only">
  <div id="quickChips" class="chips"></div>
  <button id="btnFilter" class="gearbtn" type="button">⚙ 筛选</button>
</div>

<div id="mobileTabs">
  <button class="on" data-view="map">🗺 地图</button>
  <button data-view="list">📋 候选</button>
</div>

<main id="main">
  <div id="mapWrap">
    <div id="map"></div>
    <div id="baseSwitch" title="切换地图底图">
      <button data-base="vdark" class="on">矢量·暗夜</button>
      <button data-base="amap">高德</button>
      <button data-base="sat">卫星</button>
    </div>
    <div id="legend"></div>
  </div>
  <aside id="candPanel">
    <div class="cand-head"><b>候选目的地</b><span id="candCount" class="muted"></span><span id="candHint" class="muted"></span></div>
    <div id="candList"></div>
    <div id="emptyState" class="empty" hidden></div>
  </aside>
</main>

<footer id="foot">
  <span id="dataStamp"></span>
  <span>本页为出行参考的概率分析演示，非官方气象预报 · <button id="footAbout" class="linklike">数据说明与免责</button></span>
</footer>

<div id="drawer" class="drawer"><div id="drawerBody"></div></div>

<div id="modalSubs" class="modal">
  <div class="modal-box">
    <div class="modal-head"><b>反向订阅提醒（本地演示）</b><button class="icon-btn close">✕</button></div>
    <p class="muted">保存「景观 + 区域 + 日期窗口」条件；每次打开页面按最新数据评估命中。生产版将通过微信小程序订阅消息推送。</p>
    <div id="subsList"></div>
    <h4>新建订阅</h4>
    <div id="subForm"></div>
  </div>
</div>

<div id="modalAbout" class="modal">
  <div class="modal-box wide">
    <div class="modal-head"><b>关于 / 数据说明</b><button class="icon-btn close">✕</button></div>
    <div id="aboutBody"></div>
  </div>
</div>

<div id="scrim" class="bscrim"></div>

<div id="sheetDate" class="bsheet">
  <div class="bsh"><b>选择日期</b><button class="icon-btn bx" data-close="1">✕</button></div>
  <div class="quick" id="dateQuick"></div>
  <div class="dgrid" id="dateGrid"></div>
  <p class="muted" style="margin: 10px 0 0; font-size: 11px;">色点为预报可信度：绿 高 / 黄 中 / 红 低（D0–2 高 → D7–15 低）</p>
</div>

<div id="sheetFilter" class="bsheet">
  <div class="bsh"><b>筛选</b><button class="icon-btn bx" data-close="1">✕</button></div>
  <div class="sec">── 景观（多选）──</div>
  <div class="quick" id="fLands"></div>
  <div class="sec">── 发生概率阈值 ──</div>
  <div class="frow"><input type="range" id="fThr" min="10" max="95" value="50"><b id="fThrVal" class="accent">50%</b></div>
  <div class="sec">── 观赏质量 ──</div>
  <div class="quick" id="fQuals"></div>
  <div class="sec">── 排序 ──</div>
  <div class="frow">
    <select id="fSort" class="fsel">
      <option value="prob">按概率（高→低）</option>
      <option value="dist">按距离（近→远）</option>
      <option value="quality">按观赏质量</option>
    </select>
  </div>
  <div class="sec">── 出发地等时圈（直线近似） ──</div>
  <div class="quick" id="fRings"></div>
  <button id="fDone" class="fdone" type="button">完成 · 共 0 个目的地命中</button>
</div>

<div id="toast"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="data/provinces.js?v=7"></script>
<script src="data/ws-data.js?v=7"></script>
<script src="data/ws-cache.js?v=7"></script>
<script src="js/ws-model.js?v=7"></script>
<script src="js/ws-app.js?v=7"></script>
</body>
</html>
